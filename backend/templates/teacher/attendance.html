{% extends "teacher/base.html" %}

{% block page_title %}Attendance - {{ class_section }}{% endblock %}

{% block content %}

    <div class="card form-card">
        <h3>
            <i class="fas fa-clipboard-list"></i> Mark Attendance
        </h3>
        <p class="text-muted mb-4">{{ class_section }}</p>

        <form method="POST">
            {% csrf_token %}

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th class="text-center">Present</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>
                                <i class="fas fa-user-graduate" style="color: #1E3A8A; margin-right: 8px;"></i>
                                {{ student.full_name }}
                            </td>
                            <td class="text-center">
                                <input 
                                    type="checkbox" 
                                    name="student_{{ student.id }}" 
                                    checked
                                    class="form-check-input"
                                    style="cursor: pointer; width: 20px; height: 20px;"
                                >
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check"></i> Submit Attendance
                </button>
                <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
        </form>
    </div>

{% endblock %}
